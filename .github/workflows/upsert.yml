name: Upsert to Vectorize (RAG)

# 収集データが main に反映されたら、自動で埋め込み生成 → Vectorize へ upsert する。
# 反映フロー：クロール（collect.yml）→ main へ自動コミット → collect.yml からこのワークフローを呼び出し。
# 手でデータや upsert.mjs を変えて main に入れた場合は push トリガーで動く。
# 差分のみ反映：前回から内容が変わった文書だけ埋め込む（記録は Actions キャッシュ。消えたら全件）。
#
# 必要な Secrets（リポジトリ Settings > Secrets and variables > Actions）:
#   - CLOUDFLARE_ACCOUNT_ID : Cloudflare アカウントID
#   - CLOUDFLARE_API_TOKEN  : Workers AI 実行 + Vectorize 編集の権限を持つ API トークン
#
# Secrets 未登録の間は upsert をスキップして成功扱いにする（失敗メールを出さない）。
# 登録後は自動でそのまま本実行される。

on:
  push:
    branches: [main]
    paths:
      - 'data/collected/**'
      - 'tools/crawler/upsert.mjs'
  workflow_dispatch:
    inputs:
      full:
        description: '全件を埋め込み直す（通常は差分のみ。インデックスを作り直したとき等に使う）'
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        description: 'upsert 対象のコミット（collect.yml が直前に入れたもの）'
        type: string
        required: false
        default: ''

jobs:
  upsert:
    runs-on: ubuntu-latest
    # 同時実行を抑止（連続反映時に upsert が重ならないように）。
    concurrency:
      group: rag-upsert
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check Cloudflare secrets
        id: check
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=RAG upsert skipped::CLOUDFLARE_ACCOUNT_ID / CLOUDFLARE_API_TOKEN が未登録のため upsert をスキップしました。Settings > Secrets で登録すると自動で有効になります。"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.check.outputs.configured == 'true'
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v5
        if: steps.check.outputs.configured == 'true'
        with:
          node-version: '22'
      - run: npm ci
        if: steps.check.outputs.configured == 'true'
      # 反映済みの文書ごとの内容ハッシュ（差分反映の記録）。キャッシュが消えても全件反映になるだけで壊れない。
      - name: Restore upsert state
        if: steps.check.outputs.configured == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .cache/rag-state.json
          key: rag-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: rag-state-
      - name: Upsert collected docs to Vectorize
        if: steps.check.outputs.configured == 'true'
        env:
          RAG_FULL: ${{ inputs.full && '1' || '' }}
        run: npm run rag:upsert
      # 途中で失敗しても、送り終えた分の記録は残して次回に活かす
      - name: Save upsert state
        if: always() && steps.check.outputs.configured == 'true' && hashFiles('.cache/rag-state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .cache/rag-state.json
          key: rag-state-${{ github.run_id }}-${{ github.run_attempt }}
