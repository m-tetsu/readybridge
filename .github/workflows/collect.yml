name: Collect support info (RAG)

# 公的支援情報を毎日巡回し、新規・更新があれば main に直接コミットして Vectorize へ反映する。
# 2026-10 に「PR を起票して人がレビュー」（論点③の当初案）から、レビューなしの自動取り込みに変更。
# 取得件数が極端に少ない回（サイト障害など）は、壊れたデータを入れないよう取り込みを見送る。

on:
  schedule:
    - cron: '0 21 * * *' # 毎日 06:00 JST（21:00 UTC）
  workflow_dispatch: {}

permissions:
  contents: write

# 手動実行と定時実行が重なって main へのプッシュが競合しないようにする。
concurrency:
  group: rag-collect
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci
      - name: Diagnose chusho reachability
        # 能登シードが取れない真因を切り分ける。前回 http=000/size=0（応答ゼロ）だった
        # ため、UAではなく接続レベルの問題（IPv6ブラックホール疑い）を疑って検証する。
        # 失敗してもクロール本体は続行する。
        continue-on-error: true
        run: |
          HOST="https://www.chusho.meti.go.jp"
          URL="$HOST/saigai/r6_noto_jishin/index.html"
          echo "== DNS (A / AAAA) =="
          getent ahosts www.chusho.meti.go.jp || true
          echo "== robots.txt (ホスト到達性) =="
          curl -sS -o /dev/null -m 30 -w 'http=%{http_code} time=%{time_total}s\n' "$HOST/robots.txt" || echo "robots: FAILED"
          echo "== noto page: 既定(自動) =="
          curl -sS -o /dev/null -m 60 -w 'http=%{http_code} time=%{time_total}s size=%{size_download}\n' "$URL" || echo "auto: FAILED"
          echo "== noto page: IPv4強制(-4) =="
          curl -4 -sS -o /dev/null -m 60 -w 'http=%{http_code} time=%{time_total}s size=%{size_download}\n' "$URL" || echo "ipv4: FAILED"
          echo "== noto page: IPv6強制(-6) =="
          curl -6 -sS -o /dev/null -m 60 -w 'http=%{http_code} time=%{time_total}s size=%{size_download}\n' "$URL" || echo "ipv6: FAILED"
      - name: Crawl
        run: npm run crawl
      - name: Commit to main
        id: commit
        run: |
          read -r FETCHED NEW CHANGED < <(node -e '
            const s = require("./data/collected/last-run.json").summary;
            console.log(s.pages_fetched, s.new, s.changed)')
          echo "取得 ${FETCHED} 件（新規 ${NEW}・更新 ${CHANGED}）"
          if [ "$((NEW + CHANGED))" -eq 0 ]; then
            echo "新規・更新なし。取り込みは行いません。"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$FETCHED" -lt 100 ]; then
            echo "::warning title=取り込み見送り::取得が ${FETCHED} 件と少ないため（サイト障害の可能性）、今回は main に反映しません。"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/collected
          git commit -m "収集: 支援情報の差分を取り込み（自動・新規${NEW}/更新${CHANGED}）"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # GITHUB_TOKEN でのプッシュは upsert.yml の push トリガーを起動しないため、ここから直接呼ぶ。
  upsert:
    needs: crawl
    if: needs.crawl.outputs.changed == 'true'
    uses: ./.github/workflows/upsert.yml
    with:
      ref: ${{ needs.crawl.outputs.sha }}
    secrets: inherit
